<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Revex Helpdesk</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section id="login" class="card login-card">
        <div class="brand">REVEX <span>HELPDESK</span></div>
        <h1>Mesa de ayuda</h1>
        <p>Ingresa con tu usuario para consultar y gestionar los tickets.</p>
        <form id="login-form">
          <label>Correo<input id="login-email" type="email" autocomplete="username" required /></label>
          <label>Contraseña<input id="login-password" type="password" autocomplete="current-password" required /></label>
          <button type="submit">Entrar</button>
          <div id="login-error" class="error"></div>
        </form>
      </section>

      <section id="app" hidden>
        <header class="topbar">
          <div><div class="brand">REVEX <span>HELPDESK</span></div><h1>Tickets</h1></div>
          <button id="logout" class="secondary">Cerrar sesión</button>
        </header>
        <div id="notice" class="notice" hidden></div>
        <div class="grid">
          <section class="card">
            <h2>Crear ticket</h2>
            <form id="ticket-form">
              <label>Título<input id="title" maxlength="200" required /></label>
              <label>Descripción<textarea id="description" rows="7" required></textarea></label>
              <div class="two-columns">
                <label>Prioridad<select id="priority"><option value="LOW">Baja</option><option value="MEDIUM" selected>Media</option><option value="HIGH">Alta</option><option value="URGENT">Urgente</option></select></label>
                <label>Correo del solicitante<input id="requester-email" type="email" maxlength="254" /></label>
              </div>
              <label>Nombre del solicitante<input id="requester-name" maxlength="200" /></label>
              <button type="submit">Crear ticket</button>
            </form>
          </section>
          <section class="card">
            <div class="section-heading"><h2>Tickets recientes</h2><button id="refresh" class="secondary">Actualizar</button></div>
            <div class="filters"><input id="search" placeholder="Buscar..." /><select id="status"><option value="">Todos los estados</option><option value="OPEN">Abiertos</option><option value="IN_PROGRESS">En proceso</option><option value="WAITING">En espera</option><option value="RESOLVED">Resueltos</option><option value="CLOSED">Cerrados</option></select></div>
            <div id="tickets" class="tickets"></div>
          </section>
        </div>
        <section id="detail" class="card detail" hidden></section>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
